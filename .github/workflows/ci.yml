name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm ci
        working-directory: backend
      - run: npm run test:cron
        working-directory: backend
      - run: npm run test:matcher
        working-directory: backend
      - run: node --check server.js
        working-directory: backend
